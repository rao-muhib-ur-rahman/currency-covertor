<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main id="main">

        
        <h1 id="mainHead">Currency Convertor</h1>

        <div id="amountDiv">
            <h1 id="amountHead">Enter your amount</h1>
            <input type="number" name="" id="amount">
        </div>

        <div id="convertor">
            <div class="from flex flex-col gap-2">
                <img src="https://flagsapi.com/US/flat/64.png">
                <select name="from" class="select" id="fromCountry">
                    <!-- options -->
                </select>       
            </div>

            <div>
                <i class="fa-solid fa-arrow-right-arrow-left text-2xl text-gray-600"></i>
            </div>

            <div class="to flex flex-col gap-2">
                <img src="https://flagsapi.com/PK/flat/64.png">
                <select name="to" class="select" id="toCountry">
                    <!-- options -->
                </select>       
            </div>
        </div>

        <div id="msg-div">
            <p id="msg" >This is the rate</p>
        </div>

        <button id="exc-btn">Get Exchanged</button>
        
    </main>

    <script src="./codes.js"></script>
    <script src="./index.js"></script>

</body>

</html>
